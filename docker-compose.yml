name: winhappens

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: winhappens
      POSTGRES_PASSWORD: winhappens
      POSTGRES_DB: core
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Вторая БД (payments) создаётся при первом старте.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U winhappens -d core && pg_isready -U winhappens -d payments']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  livekit:
    image: livekit/livekit-server:v1.11.0
    command: --config /etc/livekit.yaml
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
